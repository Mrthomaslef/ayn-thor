<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Switch DL" />
  <title>Rom et Emulation — Téléchargement Switch & Recomp M4 / AYN Thor</title>
  <link rel="manifest" href="manifest.json?v=4" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg?v=4" />
  <link rel="apple-touch-icon" href="assets/icon.svg?v=4" />
  <style>
    :root {
      --bg: #070b14;
      --bg-card: #111827;
      --bg-card-hover: #182236;
      --bg-elevated: #1e293b;
      --border: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #6366f1;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      max-width: 860px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px calc(env(safe-area-inset-bottom, 0px) + 36px);
    }

    /* Compact Mobile-First Header */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 8px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
    }

    .brand-title {
      min-width: 0;
      flex: 1;
    }

    .brand-title h1 {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-title p {
      margin: 1px 0 0;
      color: var(--text-muted);
      font-size: 0.7rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }
    .dot.ok { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .dot.warn { background: var(--warning); box-shadow: 0 0 6px var(--warning); }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Sticky Search & Filter Bar */
    .sticky-controls {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(7, 11, 20, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 6px 0 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      margin-bottom: 10px;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .search-input {
      width: 100%;
      background: #0d1322;
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--text);
      padding: 10px 38px 10px 13px;
      border-radius: 12px;
      font-size: 16px; /* Prevents iOS Safari zoom on focus */
      font-weight: 500;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    .clear-btn {
      position: absolute;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: rgba(148, 163, 184, 0.2);
      color: var(--text);
      font-size: 0.78rem;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .scroll-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
      margin-bottom: 6px;
    }
    .scroll-row:last-child {
      margin-bottom: 0;
    }
    .scroll-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #111827;
      color: var(--text-muted);
      border: 1px solid var(--border);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.12s ease;
    }
    .chip.active {
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent);
      border-color: var(--accent);
    }
    .chip.recomp-both.active {
      background: rgba(34, 197, 94, 0.22);
      color: #4ade80;
      border-color: #22c55e;
    }

    /* Results bar */
    .results-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 0 4px 8px;
    }

    /* Game Cards List */
    .games-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .game-card {
      background: #0c1220;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
      max-width: 100%;
      overflow: hidden;
    }
    .game-card:active {
      transform: scale(0.992);
      background: #131c31;
    }
    .game-card.has-recomp-both {
      border-color: rgba(34, 197, 94, 0.42);
      background: linear-gradient(90deg, rgba(20, 83, 45, 0.2), #0c1220 70%);
    }
    .game-card.has-recomp-m4 {
      border-color: rgba(56, 189, 248, 0.35);
    }

    .game-main {
      min-width: 0;
      flex: 1;
    }

    .game-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .game-name {
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.25;
      word-break: break-word;
    }

    .recomp-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }

    .badge {
      font-size: 0.69rem;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      line-height: 1.15;
      max-width: 100%;
    }

    .badge.m4-yes {
      background: rgba(34, 197, 94, 0.18);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
    .badge.ayn-yes {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.45);
    }
    .badge.recomp-no {
      background: rgba(148, 163, 184, 0.08);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.15);
      font-weight: 600;
    }

    .badge.fmt-nsp { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .badge.fmt-xci { background: rgba(168, 85, 247, 0.18); color: #c084fc; }
    .badge.fmt-upd { background: rgba(245, 158, 11, 0.16); color: #fbbf24; }
    .badge.fmt-inst { background: rgba(34, 197, 94, 0.28); color: #86efac; }

    .recomp-detail {
      font-size: 0.71rem;
      color: #a7f3d0;
      margin-top: 4px;
      line-height: 1.3;
      word-break: break-word;
    }

    .dl-btn {
      flex-shrink: 0;
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.28);
    }

    .btn {
      background: var(--bg-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn.primary {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      border-color: transparent;
      color: #fff;
    }

    /* Active Jobs Banner */
    .jobs-card {
      background: linear-gradient(145deg, rgba(12, 74, 110, 0.32), rgba(15, 23, 42, 0.96));
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 13px;
      padding: 11px 12px;
      margin-bottom: 10px;
      display: none;
    }

    /* Bottom Sheet Modal for 1-Click Download Inspector */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.76);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 9000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-backdrop.open {
      display: flex;
    }

    .sheet-panel {
      width: 100%;
      max-width: 680px;
      max-height: 88vh;
      background: #0f172a;
      border-top: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px 20px 0 0;
      padding: 14px 14px calc(env(safe-area-inset-bottom, 0px) + 18px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.6);
      animation: slideUp 0.18s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0.5; }
      to { transform: translateY(0); opacity: 1; }
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.35);
      margin: 0 auto 10px;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .sheet-close {
      background: rgba(148, 163, 184, 0.15);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      left: 12px;
      right: 12px;
      max-width: 420px;
      margin: 0 auto;
      background: #0f172a;
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
      display: none;
      z-index: 9999;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Compact Mobile Header -->
    <header class="top-header">
      <div class="brand-row">
        <img src="assets/icon.svg?v=4" alt="Switch DL" class="brand-logo" />
        <div class="brand-title">
          <h1>Switch DL · Recomp M4 & AYN</h1>
          <p>7 767 Jeux NSP/XCI · Compatibilité Recomp vérifiée</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="pill" title="État du serveur Mac mini M4">
          <span class="dot" id="dot-daemon"></span>
          <span id="lbl-daemon">Mac mini…</span>
        </div>
        <button class="icon-btn" onclick="refreshAll(true)" title="Actualiser">🔄</button>
      </div>
    </header>

    <!-- Active Downloads Queue (only shown when downloads exist) -->
    <div id="nxbrew-jobs-panel" class="jobs-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px;">
        <strong style="font-size:0.8rem;color:var(--accent);">⚡ Téléchargements Mac mini</strong>
        <div style="display:flex;gap:5px;">
          <button class="btn" style="padding:4px 8px;font-size:0.7rem;" onclick="clearNxbrewJobs('')">🗑️ Effacer</button>
          <button class="btn" style="padding:4px 8px;font-size:0.7rem;" onclick="refreshNxbrewJobs()">Actualiser</button>
        </div>
      </div>
      <div id="nxbrew-jobs-list" style="display:flex;flex-direction:column;gap:6px;"></div>
    </div>

    <!-- Sticky Search & Swipeable Filters -->
    <section class="sticky-controls">
      <div class="search-wrap">
        <input
          type="search"
          id="nxbrew-search-input"
          class="search-input"
          placeholder="🔍 Chercher un jeu Switch (Zelda, Mario, Pokémon, Metroid…)"
          oninput="debounceNxbrewSearch()"
        />
        <button id="search-clear-btn" class="clear-btn" onclick="quickNxbrewSearch('')">✕</button>
      </div>

      <!-- Row 1: Verified Recomp Filters -->
      <div class="scroll-row" id="nxbrew-recomp-chips">
        <button class="chip active" onclick="setNxbrewRecomp('all', this)">Tous (7 767)</button>
        <button class="chip recomp-both" onclick="setNxbrewRecomp('both', this)">🔥 M4 + AYN Thor (27)</button>
        <button class="chip" onclick="setNxbrewRecomp('m4', this)">🍎 Recomp M4 (102)</button>
        <button class="chip" onclick="setNxbrewRecomp('ayn', this)">📱 Recomp AYN (27)</button>
        <button class="chip" onclick="setNxbrewRecomp('installed', this)">✅ Déjà sur Mac</button>
      </div>

      <!-- Row 2: Quick Franchises + Formats -->
      <div class="scroll-row" id="nxbrew-franchise-chips">
        <button class="chip" onclick="quickNxbrewSearch('Zelda')">🗡️ Zelda</button>
        <button class="chip" onclick="quickNxbrewSearch('Mario')">🍄 Mario</button>
        <button class="chip" onclick="quickNxbrewSearch('Pokemon')">⚡ Pokémon</button>
        <button class="chip" onclick="quickNxbrewSearch('Metroid')">🚀 Metroid</button>
        <button class="chip" onclick="quickNxbrewSearch('Xenoblade')">⚔️ Xenoblade</button>
        <button class="chip" onclick="quickNxbrewSearch('Fire Emblem')">🛡️ Fire Emblem</button>
        <button class="chip" onclick="quickNxbrewSearch('Donkey Kong')">🦍 DK</button>
        <button class="chip" onclick="quickNxbrewSearch('Kirby')">⭐ Kirby</button>
        <button class="chip" onclick="quickNxbrewSearch('Final Fantasy')">💎 FF</button>
        <button class="chip" onclick="quickNxbrewSearch('Dragon Quest')">🐉 DQ</button>
        <button class="chip" onclick="quickNxbrewSearch('Diablo')">😈 Diablo</button>
        <button class="chip" onclick="quickNxbrewSearch('Persona')">🎭 Persona</button>
      </div>
    </section>

    <!-- Results Count + Format Toggle -->
    <div class="results-bar">
      <span id="nxbrew-results-count">Chargement du catalogue…</span>
      <select id="nxbrew-format-select" onchange="setNxbrewFormat(this.value)" style="background:#111827;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:0.74rem;font-weight:700;">
        <option value="all">Tous formats</option>
        <option value="nsp">NSP uniquement</option>
        <option value="xci">XCI uniquement</option>
        <option value="update">Avec Update</option>
        <option value="dlc">Avec DLC</option>
      </select>
    </div>

    <!-- Main Full-Width Game List -->
    <div id="nxbrew-catalog-list" class="games-list">
      Chargement…
    </div>
  </div>

  <!-- Bottom Sheet Modal for 1-Click Download -->
  <div id="inspector-backdrop" class="sheet-backdrop" onclick="if(event.target===this) closeInspectorSheet()">
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <strong style="font-size:0.9rem;color:var(--accent);">📦 Téléchargement Direct 1-Clic</strong>
        <button class="sheet-close" onclick="closeInspectorSheet()">✕ Fermer</button>
      </div>
      <div id="nxbrew-inspector-body" style="font-size:0.83rem;color:var(--text-muted);line-height:1.45;"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => r.unregister());
      }).catch(() => {});
    }
    if ("caches" in window) {
      caches.keys().then(keys => {
        keys.forEach(k => caches.delete(k));
      }).catch(() => {});
    }

    let API_BASE = "";
    let NXBREW_FORMAT = "all";
    let NXBREW_RECOMP = "all";
    let NXBREW_SEARCH_TIMER = null;
    let NXBREW_JOBS_TIMER = null;
    let LOCAL_CATALOG_CACHE = null;

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { el.style.display = "none"; }, 3800);
    }

    function openInspectorSheet() {
      document.getElementById("inspector-backdrop").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeInspectorSheet() {
      document.getElementById("inspector-backdrop").classList.remove("open");
      document.body.style.overflow = "";
    }

    function normTxt(s) {
      return (s || "")
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    }

    function updateClearBtn() {
      const inp = document.getElementById("nxbrew-search-input");
      const btn = document.getElementById("search-clear-btn");
      if (btn && inp) {
        btn.style.display = inp.value.trim() ? "inline-flex" : "none";
      }
    }

    function debounceNxbrewSearch() {
      updateClearBtn();
      clearTimeout(NXBREW_SEARCH_TIMER);
      NXBREW_SEARCH_TIMER = setTimeout(() => searchNxbrewCatalog(), 180);
    }

    function quickNxbrewSearch(q) {
      const inp = document.getElementById("nxbrew-search-input");
      if (inp) inp.value = q;
      updateClearBtn();
      searchNxbrewCatalog();
    }

    function setNxbrewFormat(fmt) {
      NXBREW_FORMAT = fmt;
      searchNxbrewCatalog();
    }

    function setNxbrewRecomp(mode, btn) {
      NXBREW_RECOMP = mode;
      document.querySelectorAll("#nxbrew-recomp-chips .chip").forEach(c => c.classList.remove("active"));
      if (btn) btn.classList.add("active");
      searchNxbrewCatalog();
    }

    function shortToolLabel(toolStr, fallback) {
      if (!toolStr) return fallback;
      return toolStr.split("(")[0].trim();
    }

    function renderMobileRecompBadges(rc) {
      if (rc && rc.m4 && rc.ayn) {
        const m4Short = shortToolLabel(rc.m4Tool, "Natif ARM64");
        const aynShort = shortToolLabel(rc.aynTool, "Natif Android");
        return `
          <span class="badge m4-yes">🍎 M4 : OUI (${m4Short})</span>
          <span class="badge ayn-yes">📱 AYN : OUI (${aynShort})</span>
        `;
      }
      if (rc && rc.m4 && !rc.ayn) {
        const m4Short = shortToolLabel(rc.m4Tool, "Natif ARM64");
        return `
          <span class="badge m4-yes">🍎 M4 : OUI (${m4Short})</span>
          <span class="badge recomp-no">📱 AYN : Non (Eden)</span>
        `;
      }
      return `
        <span class="badge recomp-no">🍎 M4 : Non (Ryujinx)</span>
        <span class="badge recomp-no">📱 AYN : Non (Eden)</span>
      `;
    }

    function renderGameList(games, totalCatalog) {
      const listEl = document.getElementById("nxbrew-catalog-list");
      const countEl = document.getElementById("nxbrew-results-count");
      countEl.textContent = `${games.length} affichés sur ${(totalCatalog || games.length).toLocaleString("fr-FR")} jeux`;

      if (games.length === 0) {
        listEl.innerHTML = `<div style="padding:24px 12px;color:var(--text-muted);text-align:center;font-size:0.85rem;">Aucun jeu trouvé pour ce filtre.</div>`;
        return;
      }

      listEl.innerHTML = games.map((g, idx) => {
        const fmtBadges = [];
        if (g.hasNsp) fmtBadges.push('<span class="badge fmt-nsp">NSP</span>');
        if (g.hasXci) fmtBadges.push('<span class="badge fmt-xci">XCI</span>');
        if (g.hasUpdate) fmtBadges.push('<span class="badge fmt-upd">+Upd</span>');
        if (g.hasDlc) fmtBadges.push('<span class="badge fmt-upd">+DLC</span>');
        if (g.installed) fmtBadges.push('<span class="badge fmt-inst">✅ Sur Mac</span>');

        const rc = g.recomp || null;
        const cardClass = (rc && rc.m4 && rc.ayn)
          ? "game-card has-recomp-both"
          : (rc && rc.m4)
            ? "game-card has-recomp-m4"
            : "game-card";

        const safeUrl = (g.url || "").replace(/'/g, "\\'");
        const safeTitle = (g.shortName || "").replace(/'/g, "\\'");

        return `
          <div class="${cardClass}" onclick="selectAndInspectGame(${idx}, '${safeUrl}', '${safeTitle}')">
            <div class="game-main">
              <div class="game-title-row">
                <span class="game-name">${g.shortName}</span>
                ${fmtBadges.join("")}
              </div>
              <div class="recomp-row">
                ${renderMobileRecompBadges(rc)}
              </div>
              ${rc && rc.note ? `<div class="recomp-detail">✓ ${rc.note}</div>` : ""}
            </div>
            <button class="dl-btn" onclick="event.stopPropagation();selectAndInspectGame(${idx}, '${safeUrl}', '${safeTitle}')">
              📥 DL
            </button>
          </div>
        `;
      }).join("");

      window._lastRenderedGames = games;
    }

    function selectAndInspectGame(idx, url, shortTitle) {
      const g = (window._lastRenderedGames || [])[idx];
      const rc = g ? (g.recomp || null) : null;
      inspectNxbrewGame(url, shortTitle, rc);
    }

    async function loadFallbackCatalog() {
      if (LOCAL_CATALOG_CACHE) return LOCAL_CATALOG_CACHE;
      const r = await fetch("data/nxbrew_catalog.json?t=" + Date.now());
      if (!r.ok) throw new Error("Failed to load local catalog");
      LOCAL_CATALOG_CACHE = await r.json();
      return LOCAL_CATALOG_CACHE;
    }

    async function searchNxbrewCatalog() {
      const q = (document.getElementById("nxbrew-search-input") || {}).value || "";
      const listEl = document.getElementById("nxbrew-catalog-list");

      if (API_BASE && NXBREW_RECOMP !== "installed") {
        try {
          const r = await fetch(
            `${API_BASE}/api/nxbrew-catalog?q=${encodeURIComponent(q)}&format=${NXBREW_FORMAT}&recomp=${NXBREW_RECOMP}&limit=120`
          );
          const res = await r.json();
          if (res.ok) {
            renderGameList(res.games, res.totalCatalog);
            return;
          }
        } catch (_) {}
      } else if (API_BASE && NXBREW_RECOMP === "installed") {
        try {
          const r = await fetch(`${API_BASE}/api/nxbrew-catalog?q=${encodeURIComponent(q)}&format=${NXBREW_FORMAT}&limit=250`);
          const res = await r.json();
          if (res.ok) {
            const instGames = (res.games || []).filter(g => g.installed);
            renderGameList(instGames, res.totalCatalog);
            return;
          }
        } catch (_) {}
      }

      // Offline / GitHub Pages direct fallback
      try {
        const data = await loadFallbackCatalog();
        const allGames = data.games || [];
        const qNorm = normTxt(q);
        const qTokens = qNorm ? qNorm.split(" ") : [];

        const matched = allGames.filter(g => {
          if (NXBREW_FORMAT === "nsp" && !g.hasNsp) return false;
          if (NXBREW_FORMAT === "xci" && !g.hasXci) return false;
          if (NXBREW_FORMAT === "update" && !g.hasUpdate) return false;
          if (NXBREW_FORMAT === "dlc" && !g.hasDlc) return false;

          const rc = g.recomp || {};
          if (NXBREW_RECOMP === "both" && !(rc.m4 && rc.ayn)) return false;
          if (NXBREW_RECOMP === "m4" && !rc.m4) return false;
          if (NXBREW_RECOMP === "ayn" && !rc.ayn) return false;

          if (qTokens.length > 0) {
            const hay = normTxt((g.title || "") + " " + (g.shortName || "") + " " + (g.url || ""));
            if (!qTokens.every(t => hay.includes(t))) return false;
          }
          return true;
        });

        matched.sort((a, b) => {
          const ra = a.recomp || {};
          const rb = b.recomp || {};
          const scoreA = (ra.m4 && ra.ayn) ? 2 : (ra.m4 ? 1 : 0);
          const scoreB = (rb.m4 && rb.ayn) ? 2 : (rb.m4 ? 1 : 0);
          if (scoreA !== scoreB) return scoreB - scoreA;
          return (a.shortName || "").localeCompare(b.shortName || "");
        });

        renderGameList(matched.slice(0, 120), allGames.length);
      } catch (e) {
        listEl.innerHTML = "Impossible de charger le catalogue Switch.";
      }
    }

    function renderInspectorRecompBox(rc) {
      if (rc && rc.m4 && rc.ayn) {
        return `
          <div style="margin-top:10px;padding:10px 12px;background:rgba(20,83,45,0.3);border:1px solid rgba(34,197,94,0.45);border-radius:11px;">
            <div style="font-weight:800;font-size:0.8rem;color:#4ade80;margin-bottom:4px;">
              🔥 Recomp Natif Vérifié (Mac M4 + AYN Thor)
            </div>
            <div style="font-size:0.76rem;color:#e2e8f0;line-height:1.45;">
              • <strong>Mac mini M4 :</strong> OUI — <code>${rc.m4Tool}</code><br/>
              • <strong>AYN Thor :</strong> OUI — <code>${rc.aynTool}</code><br/>
              <span style="color:#a7f3d0;">✓ ${rc.note || ""}</span>
            </div>
          </div>
        `;
      }
      if (rc && rc.m4 && !rc.ayn) {
        return `
          <div style="margin-top:10px;padding:10px 12px;background:rgba(12,74,110,0.28);border:1px solid rgba(56,189,248,0.4);border-radius:11px;">
            <div style="font-weight:800;font-size:0.8rem;color:#38bdf8;margin-bottom:4px;">
              🍎 Recomp Natif Vérifié sur Mac mini M4 uniquement
            </div>
            <div style="font-size:0.76rem;color:#e2e8f0;line-height:1.45;">
              • <strong>Mac mini M4 :</strong> OUI — <code>${rc.m4Tool}</code><br/>
              • <strong>AYN Thor :</strong> Non (utilisez l'émulateur <strong>Eden</strong>)<br/>
              <span style="color:#bae6fd;">✓ ${rc.note || ""}</span>
            </div>
          </div>
        `;
      }
      return `
        <div style="margin-top:10px;padding:9px 11px;background:rgba(148,163,184,0.08);border:1px solid var(--border);border-radius:10px;font-size:0.75rem;color:var(--text-muted);">
          • <strong>Recomp Mac mini M4 :</strong> Non (Émulation <strong>Ryujinx</strong>)<br/>
          • <strong>Recomp AYN Thor :</strong> Non (Émulation <strong>Eden</strong>)
        </div>
      `;
    }

    async function inspectNxbrewGame(url, shortTitle = "", fallbackRecomp = null) {
      openInspectorSheet();
      const bodyEl = document.getElementById("nxbrew-inspector-body");

      bodyEl.innerHTML = `
        <div style="padding:10px 4px;text-align:center;color:var(--accent);">
          <div style="font-size:1.35rem;margin-bottom:4px;">⏳</div>
          <strong>Récupération des miroirs de téléchargement…</strong>
          <p style="margin:4px 0 0;font-size:0.75rem;color:var(--text-muted);">
            Extraction FileKeeper / DataNodes / 1Fichier pour <em>${shortTitle || url}</em>…
          </p>
          <div style="text-align:left;margin-top:8px;">
            ${renderInspectorRecompBox(fallbackRecomp)}
          </div>
        </div>
      `;

      if (!API_BASE) {
        const st = await resolveBackend();
        if (st) {
          const dotDaemon = document.getElementById("dot-daemon");
          const lblDaemon = document.getElementById("lbl-daemon");
          if (dotDaemon) dotDaemon.className = "dot ok";
          if (lblDaemon) lblDaemon.textContent = "Mac mini prêt";
        }
      }

      if (!API_BASE) {
        bodyEl.innerHTML = `
          <div>
            <h3 style="margin:0 0 6px;font-size:0.95rem;color:var(--text);">${shortTitle || url}</h3>
            ${renderInspectorRecompBox(fallbackRecomp)}
            <div style="margin-top:12px;padding:12px;background:#090d16;border:1px solid var(--border);border-radius:10px;">
              <p style="margin:0 0 10px;color:var(--warning);font-size:0.78rem;">
                ⚠️ Mac mini hors-ligne : ouvrez la fiche NXBrew directement dans votre navigateur :
              </p>
              <a class="btn primary" style="width:100%;" href="${url}" target="_blank" rel="noopener">🔗 Ouvrir sur NXBrew.net</a>
            </div>
          </div>
        `;
        return;
      }

      try {
        const r = await fetch(`${API_BASE}/api/nxbrew-info?url=${encodeURIComponent(url)}`);
        const res = await r.json();
        if (!res.ok) {
          bodyEl.innerHTML = `
            <div>
              ${renderInspectorRecompBox(fallbackRecomp)}
              <div style="color:var(--danger);padding:10px 0;">❌ ${res.error || "Erreur lors de la lecture de la page."}</div>
              <a class="btn primary" style="width:100%;" href="${url}" target="_blank" rel="noopener">🔗 Ouvrir sur NXBrew.net</a>
            </div>
          `;
          return;
        }

        const rc = res.recomp || fallbackRecomp || null;
        const safeGameTitle = (res.title || shortTitle || "Switch Game").replace(/'/g, "\\'");

        const sectionsHtml = (res.sections || []).map(sec => {
          const safeSecType = (sec.type || "Base Game").replace(/'/g, "\\'");
          const mirrorsHtml = (sec.mirrors || []).map(m => {
            const isFast = /filekeeper|1fichier/i.test(m.host);
            const safeMirrorUrl = m.url.replace(/'/g, "\\'");
            return `
              <div style="display:flex;gap:6px;width:100%;">
                <button
                  class="btn ${isFast ? 'primary' : ''}"
                  style="flex:1;padding:10px 12px;font-size:0.8rem;"
                  onclick="startNxbrewDownload('${safeMirrorUrl}', '${safeGameTitle}', '${safeSecType}')"
                >
                  ⬇️ ${m.host} ${isFast ? '⚡ (Auto Mac)' : ''}
                </button>
                <button
                  class="btn"
                  style="padding:10px;font-size:0.75rem;"
                  onclick="unlockNxbrewLink('${safeMirrorUrl}')"
                  title="Déverrouiller le lien dans le navigateur"
                >
                  🔓
                </button>
              </div>
            `;
          }).join("");

          return `
            <div style="margin-top:10px;padding:10px;background:#080c15;border:1px solid var(--border);border-radius:11px;">
              <div style="font-weight:700;font-size:0.8rem;color:#e2e8f0;margin-bottom:8px;">
                📁 ${sec.label} <span style="font-size:0.72rem;color:var(--accent);">(${sec.type})</span>
              </div>
              <div style="display:flex;flex-direction:column;gap:7px;">
                ${mirrorsHtml || '<span style="color:var(--text-muted);">Aucun miroir détecté.</span>'}
              </div>
            </div>
          `;
        }).join("");

        bodyEl.innerHTML = `
          <div>
            <div style="display:flex;gap:10px;align-items:center;">
              ${res.thumb ? `<img src="${res.thumb}" alt="" style="width:58px;height:58px;object-fit:cover;border-radius:10px;border:1px solid var(--border);flex-shrink:0;" />` : ""}
              <div style="flex:1;min-width:0;">
                <h3 style="margin:0 0 4px;font-size:0.9rem;color:var(--text);line-height:1.25;">${res.title}</h3>
                <a href="${res.url}" target="_blank" rel="noopener" style="font-size:0.73rem;color:var(--accent);">🔗 Voir sur NXBrew.net</a>
              </div>
            </div>
            ${renderInspectorRecompBox(rc)}
            ${sectionsHtml || '<div style="margin-top:12px;color:var(--warning);">Aucun lien trouvé sur cette page.</div>'}
          </div>
        `;
      } catch (e) {
        bodyEl.innerHTML = `<div style="color:var(--danger);padding:12px;">❌ Erreur réseau lors de l'extraction de la fiche.</div>`;
      }
    }

    async function startNxbrewDownload(mirrorUrl, gameTitle, secType) {
      if (!API_BASE) return showToast("Daemon Mac mini non connecté.");
      showToast(`Téléchargement lancé : ${gameTitle} (${secType})`);
      closeInspectorSheet();
      try {
        const r = await fetch(`${API_BASE}/api/nxbrew-download`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "download", url: mirrorUrl, title: gameTitle, type: secType }),
        });
        const res = await r.json();
        if (!res.ok) return showToast(res.error || "Erreur au lancement du téléchargement.");
        showToast(`Téléchargement démarré sur le Mac mini !`);
        refreshNxbrewJobs();
      } catch (e) {
        showToast("Erreur réseau lors du lancement.");
      }
    }

    async function unlockNxbrewLink(mirrorUrl) {
      if (!API_BASE) return showToast("Daemon Mac mini non connecté.");
      showToast("Déverrouillage ouo.io (5-10s)…");
      try {
        const r = await fetch(`${API_BASE}/api/nxbrew-download`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "resolve", url: mirrorUrl }),
        });
        const res = await r.json();
        if (!res.ok) return showToast(res.error || "Impossible de déverrouiller ce lien.");
        const target = res.directUrl || res.hostUrl;
        window.open(target, "_blank", "noopener");
      } catch (e) {
        showToast("Erreur lors du déverrouillage.");
      }
    }

    async function clearNxbrewJobs(jobId = "") {
      if (!API_BASE) return;
      try {
        await fetch(`${API_BASE}/api/nxbrew-download`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "clear", jobId }),
        });
        refreshNxbrewJobs();
      } catch (_) {}
    }

    async function refreshNxbrewJobs() {
      if (!API_BASE) return;
      try {
        const r = await fetch(`${API_BASE}/api/nxbrew-jobs`);
        const res = await r.json();
        const panel = document.getElementById("nxbrew-jobs-panel");
        const list = document.getElementById("nxbrew-jobs-list");
        if (!res.ok || !res.jobs || res.jobs.length === 0) {
          if (panel) panel.style.display = "none";
          return;
        }
        panel.style.display = "block";
        list.innerHTML = res.jobs.map(j => {
          const pct = Number(j.percent || 0).toFixed(1);
          const isDone = j.status === "done";
          const isErr = j.status === "error";
          const barColor = isDone ? "#22c55e" : isErr ? "#ef4444" : "#38bdf8";
          const safeJobId = (j.jobId || "").replace(/'/g, "\\'");
          const openBtn = (isErr && j.hostUrl)
            ? `<a href="${j.hostUrl}" target="_blank" rel="noopener" class="btn primary" style="margin-top:6px;padding:6px 10px;font-size:0.72rem;width:100%;">🔓 Ouvrir le lien déverrouillé dans Safari</a>`
            : "";
          return `
            <div style="padding:8px 10px;background:#080c14;border:1px solid var(--border);border-radius:9px;">
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.76rem;font-weight:700;gap:6px;">
                <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${j.gameTitle}</span>
                <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                  <span style="color:${barColor};">${pct}% ${j.speedMBps ? `(${j.speedMBps} Mo/s)` : ''}</span>
                  <button onclick="clearNxbrewJobs('${safeJobId}')" style="background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:0.78rem;padding:0 2px;">✕</button>
                </div>
              </div>
              <div style="width:100%;height:5px;background:#1e293b;border-radius:999px;overflow:hidden;margin:5px 0;">
                <div style="width:${Math.min(100, Math.max(2, j.percent || 0))}%;height:100%;background:${barColor};"></div>
              </div>
              <div style="font-size:0.7rem;color:var(--text-muted);line-height:1.35;">${j.message || ''}</div>
              ${openBtn}
            </div>
          `;
        }).join("");

        const anyActive = res.jobs.some(j => ["starting", "resolving", "downloading", "extracting"].includes(j.status));
        clearTimeout(NXBREW_JOBS_TIMER);
        if (anyActive) {
          NXBREW_JOBS_TIMER = setTimeout(refreshNxbrewJobs, 1500);
        }
      } catch (_) {}
    }

    async function probeCandidate(url) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 5000);
      try {
        const res = await fetch(url + "/api/nxbrew-jobs", { signal: ctrl.signal });
        clearTimeout(t);
        if (res.ok) {
          const data = await res.json();
          if (data && data.ok) return url;
        }
      } catch (_) {
        clearTimeout(t);
      }
      throw new Error("unreachable");
    }

    async function resolveBackend() {
      const candidates = new Set();
      if (location.port === "8798") {
        candidates.add(location.origin);
      }
      try {
        const r = await fetch("endpoint.json?t=" + Date.now(), { cache: "no-store" });
        if (r.ok) {
          const ep = await r.json();
          if (ep.tunnelUrl) candidates.add(ep.tunnelUrl);
          if (ep.lanUrl && location.protocol !== "https:") candidates.add(ep.lanUrl);
        }
      } catch (_) {}
      candidates.add("https://align-jelsoft-network-chelsea.trycloudflare.com");
      candidates.add("https://group-medication-robots-mag.trycloudflare.com");
      if (location.protocol !== "https:") {
        candidates.add("http://192.168.1.152:8798");
        candidates.add("http://192.168.1.111:8798");
        candidates.add("http://127.0.0.1:8798");
      }

      try {
        const winner = await Promise.any(Array.from(candidates).map(u => probeCandidate(u)));
        API_BASE = winner;
        return { ok: true, url: winner };
      } catch (_) {
        API_BASE = "";
        return null;
      }
    }

    async function refreshAll(withFeedback = false) {
      const dotDaemon = document.getElementById("dot-daemon");
      const lblDaemon = document.getElementById("lbl-daemon");
      searchNxbrewCatalog();
      const st = await resolveBackend();
      if (st) {
        dotDaemon.className = "dot ok";
        lblDaemon.textContent = "Mac mini prêt";
        refreshNxbrewJobs();
        searchNxbrewCatalog();
      } else {
        dotDaemon.className = "dot warn";
        lblDaemon.textContent = "Catalogue";
      }
      if (withFeedback) showToast("Catalogue Switch actualisé.");
    }

    refreshAll(false);
    setInterval(() => {
      if (API_BASE) refreshNxbrewJobs();
    }, 6000);
  </script>
