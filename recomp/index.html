<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Recomp Check">
  <title>Recomp Check — AYN Thor & Mac mini M4</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root { --bg: #0b0f1a; --panel: #131a2a; --panel2: #1a2337; --line: #26324b;
      --text: #e8edf7; --muted: #8a97b2; --ayn: #ff5a5f; --m4: #5ab0ff; --both: #34d399; --warn: #fbbf24; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
    body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      overscroll-behavior-y: contain;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
    button, input, .game { touch-action: manipulation; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 14px 12px calc(env(safe-area-inset-bottom) + 40px); }

    #ptr { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 50%; z-index: 60;
      width: 34px; height: 34px; margin-left: -17px; border-radius: 50%; background: var(--panel2);
      border: 1px solid var(--line); display: grid; place-items: center; opacity: 0; pointer-events: none;
      transform: translateY(-40px); }
    #ptr svg { width: 18px; height: 18px; }
    #ptr.spin svg { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    header { display: flex; align-items: center; gap: 10px; margin: 2px 2px 12px; }
    header img { width: 34px; height: 34px; border-radius: 9px; }
    h1 { font-size: 1.2rem; margin: 0; }

    /* Barre collante : filtre + recherche */
    .bar > * { max-width: 620px; }
    .bar { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 6px 0 10px;
      margin: 0 -12px; padding-left: 12px; padding-right: 12px; }
    .seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 8px; }
    .seg button { background: none; border: 0; color: var(--muted); border-radius: 9px; padding: 8px 2px;
      font: inherit; font-size: .78rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .seg button span { opacity: .7; font-weight: 500; }
    .seg button[aria-pressed="true"] { background: var(--panel2); color: var(--text); }
    .seg button[data-f="both"][aria-pressed="true"] { color: var(--both); }
    .seg button[data-f="ayn"][aria-pressed="true"] { color: var(--ayn); }
    .seg button[data-f="m4"][aria-pressed="true"] { color: var(--m4); }
    #q { width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 12px; padding: 10px 12px; font-size: 16px; outline: none; }
    #q:focus { border-color: var(--m4); }

    /* Grille de jaquettes */
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
    @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (min-width: 860px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (min-width: 1100px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
    .game { background: none; border: 0; padding: 0; color: inherit; text-align: left; font: inherit; cursor: pointer; min-width: 0; }
    .art { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--panel2);
      box-shadow: 0 6px 18px rgba(0,0,0,.4); }
    .art .blur { position: absolute; inset: -12px; width: calc(100% + 24px); height: calc(100% + 24px);
      object-fit: cover; filter: blur(14px) brightness(.55); }
    .art .img { position: relative; width: 100%; height: 100%; object-fit: contain; display: block; }
    .art .ph { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; color: var(--muted); }
    .inst { position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; border-radius: 50%;
      background: var(--both); color: #062; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
    .inst svg { width: 13px; height: 13px; }
    .name { font-weight: 600; font-size: .86rem; line-height: 1.2; margin: 8px 2px 5px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .pills { display: flex; gap: 5px; margin: 0 2px; }
    .pill { font-size: .68rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; border: 1px solid; }
    .pill.ayn { color: var(--ayn); } .pill.m4 { color: var(--m4); }
    .pill.off { color: var(--muted); opacity: .4; text-decoration: line-through; }
    .empty { text-align: center; color: var(--muted); padding: 40px 10px; grid-column: 1 / -1; }
    footer { color: var(--muted); font-size: .7rem; text-align: center; margin-top: 22px; }

    /* Fiche détail */
    #sheet { position: fixed; inset: 0; z-index: 50; display: none; }
    #sheet.open { display: block; }
    #sheet .back { position: absolute; inset: 0; background: rgba(0,0,0,.6); }
    #sheet .box { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto;
      background: var(--panel); border: 1px solid var(--line); border-radius: 20px 20px 0 0;
      padding: 18px 18px calc(env(safe-area-inset-bottom) + 28px); max-height: 88vh; overflow-y: auto; }
    .sh-top { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; margin-bottom: 14px; }
    .sh-top img, .sh-top .ph { width: 120px; height: 120px; border-radius: 12px; object-fit: contain; background: var(--panel2);
      display: grid; place-items: center; color: var(--muted); font-weight: 700; }
    .sh-top h2 { font-size: 1.05rem; margin: 0 0 4px; }
    .sh-top .sys { color: var(--muted); font-size: .8rem; }
    .dev { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
    .dev b { display: block; font-size: .8rem; margin-bottom: 2px; }
    .dev.ayn b { color: var(--ayn); } .dev.m4 b { color: var(--m4); }
    .dev div { font-size: .82rem; overflow-wrap: anywhere; }
    .dev.off { opacity: .55; }
    .dev .st { color: var(--warn); font-weight: 700; font-size: .7rem; text-transform: uppercase; margin-left: 4px; }
    .note { color: var(--muted); font-size: .78rem; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="ptr" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
  </div>

  <div class="wrap">
    <header><img src="icon.svg" alt=""><h1>Recomp Check</h1></header>

    <div class="bar">
      <div class="seg" role="group" aria-label="Compatibilité">
        <button data-f="both" aria-pressed="true">Les deux <span id="n-both"></span></button>
        <button data-f="ayn" aria-pressed="false">AYN <span id="n-ayn"></span></button>
        <button data-f="m4" aria-pressed="false">Mac <span id="n-m4"></span></button>
        <button data-f="all" aria-pressed="false">Tous <span id="n-all"></span></button>
      </div>
      <input id="q" type="search" placeholder="Rechercher un jeu, une console…" autocomplete="off">
    </div>

    <div class="grid" id="grid"></div>
    <footer id="foot"></footer>
  </div>

  <div id="sheet" aria-hidden="true"><div class="back"></div><div class="box" id="sheet-box"></div></div>

  <script src="data/embedded_data.js"></script>
  <script>
    const state = { f: "both", q: "" };
    let DATA = window.RECOMP_DATA || { games: [], stats: {}, systemLabels: {} };
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    const sysNames = (g) => g.systems.map(s => DATA.systemLabels[s] || s).join(" · ");
    const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
    let LIST = [];

    const pass = (g) => state.f === "both" ? g.m4 && g.ayn : state.f === "ayn" ? g.ayn : state.f === "m4" ? g.m4 : true;

    function art(g) {
      if (!g.cover) return `<div class="ph">${esc(DATA.systemLabels[g.systems[0]] || "")}</div>`;
      const u = esc(g.cover);
      return `<img class="blur" src="${u}" alt="" loading="lazy" referrerpolicy="no-referrer">
              <img class="img" src="${u}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.querySelectorAll('img').forEach(i=>i.remove())">`;
    }

    function render() {
      const q = norm(state.q);
      LIST = DATA.games.filter(g => pass(g) &&
        (!q || norm(g.title + " " + sysNames(g) + " " + (g.m4Tool || "") + " " + (g.aynTool || "")).includes(q)));
      $("grid").innerHTML = LIST.length ? LIST.map((g, i) => `
        <button class="game" data-i="${i}">
          <div class="art">${art(g)}${g.installed ? `<span class="inst" title="Installé">${CHECK}</span>` : ""}</div>
          <div class="name">${esc(g.title)}</div>
          <div class="pills"><span class="pill ayn ${g.ayn ? "" : "off"}">AYN</span><span class="pill m4 ${g.m4 ? "" : "off"}">Mac</span></div>
        </button>`).join("") : `<div class="empty">Aucun jeu trouvé.</div>`;
    }

    function renderAll() {
      const s = DATA.stats || {};
      $("n-both").textContent = s.both ?? ""; $("n-ayn").textContent = s.ayn ?? "";
      $("n-m4").textContent = s.m4 ?? ""; $("n-all").textContent = s.total ?? "";
      if (DATA.generatedAt) $("foot").textContent = "Mis à jour le " + new Date(DATA.generatedAt).toLocaleDateString("fr-FR", { dateStyle: "long" }) + " · touche une jaquette pour le détail";
      render();
    }

    function dev(kind, label, ok, tool, status) {
      const st = status && status !== "playable" ? `<span class="st">${esc(status)}</span>` : "";
      return `<div class="dev ${kind} ${ok ? "" : "off"}"><b>${label}</b><div>${ok
        ? esc(String(tool || "Natif").replace(/`/g, "")) + st
        : "Pas de portage natif — émulation uniquement"}</div></div>`;
    }

    function openSheet(g) {
      $("sheet-box").innerHTML = `
        <div class="sh-top">${g.cover ? `<img src="${esc(g.cover)}" alt="" referrerpolicy="no-referrer">` : `<div class="ph">${esc(sysNames(g))}</div>`}
          <div><h2>${esc(g.title)}</h2><div class="sys">${esc(sysNames(g))}${g.installed ? ' · <span style="color:var(--both)">Installé</span>' : ""}</div></div></div>
        ${dev("ayn", "AYN Thor", g.ayn, g.aynTool, g.aynStatus)}
        ${dev("m4", "Mac mini M4", g.m4, g.m4Tool)}
        ${g.note ? `<div class="note">${esc(g.note)}</div>` : ""}`;
      $("sheet").classList.add("open"); $("sheet").setAttribute("aria-hidden", "false");
    }
    const closeSheet = () => { $("sheet").classList.remove("open"); $("sheet").setAttribute("aria-hidden", "true"); };

    document.querySelector(".seg").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      state.f = b.dataset.f;
      document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
      render();
    });
    $("q").addEventListener("input", e => { state.q = e.target.value; render(); });
    $("grid").addEventListener("click", e => { const b = e.target.closest(".game"); if (b) openSheet(LIST[+b.dataset.i]); });
    document.querySelector("#sheet .back").addEventListener("click", closeSheet);
    addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

    async function refresh() {
      try {
        const r = await fetch("data/recomp.json?t=" + Date.now(), { cache: "no-store" });
        if (r.ok) { DATA = await r.json(); renderAll(); }
      } catch (_) { /* hors-ligne : données embarquées */ }
    }

    // Pull-to-refresh tactile + souris (flèche ↻ seule)
    (function ptr() {
      const el = $("ptr"), icon = el.querySelector("svg"), MAX = 90, TRIG = 65;
      let y0 = null, dy = 0, busy = false;
      const start = (y) => { if (!busy && window.scrollY <= 0 && !$("sheet").classList.contains("open")) { y0 = y; dy = 0; } };
      const move = (y, ev) => {
        if (y0 === null) return;
        dy = Math.min(MAX, Math.max(0, (y - y0) * 0.55));
        if (dy > 0 && ev && ev.cancelable) ev.preventDefault();
        el.style.opacity = Math.min(1, dy / TRIG);
        el.style.transform = `translateY(${dy - 40}px)`;
        icon.style.transform = `rotate(${dy * 4}deg)`;
      };
      const end = async () => {
        if (y0 === null) return; y0 = null;
        if (dy >= TRIG) {
          busy = true; if (navigator.vibrate) navigator.vibrate(12);
          icon.style.transform = ""; el.classList.add("spin");
          await Promise.all([refresh(), new Promise(r => setTimeout(r, 600))]);
          el.classList.remove("spin"); busy = false;
        }
        el.style.opacity = 0; el.style.transform = "translateY(-40px)";
      };
      addEventListener("touchstart", e => start(e.touches[0].clientY), { passive: true });
      addEventListener("touchmove", e => move(e.touches[0].clientY, e), { passive: false });
      addEventListener("touchend", end);
      addEventListener("mousedown", e => { if (e.button === 0 && !e.target.closest("input,button")) start(e.clientY); });
      addEventListener("mousemove", e => { if (y0 !== null) move(e.clientY); });
      addEventListener("mouseup", end);
    })();

    renderAll();
    refresh();
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
