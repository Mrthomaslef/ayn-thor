<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Deep Dark Gaming Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#071E26"/>
    </linearGradient>

    <!-- Switch Cyan -> Indigo -> Emerald Rim -->
    <linearGradient id="rimGrad" x1="24" y1="24" x2="488" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C3E3"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#FF4554"/>
    </linearGradient>

    <!-- Left Joy-Con / Grip Cyan -->
    <linearGradient id="leftGrip" x1="56" y1="128" x2="148" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Right Joy-Con / Grip Red-Coral -->
    <linearGradient id="rightGrip" x1="364" y1="128" x2="456" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5E6C"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Download Arrow Emerald-Cyan Gradient -->
    <linearGradient id="dlGrad" x1="256" y1="148" x2="256" y2="318" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>

  <!-- Ambient Glows -->
  <circle cx="128" cy="240" r="130" fill="#00C3E3" opacity="0.18" filter="url(#neonGlow)"/>
  <circle cx="384" cy="240" r="130" fill="#FF4554" opacity="0.18" filter="url(#neonGlow)"/>
  <circle cx="256" cy="240" r="110" fill="#10B981" opacity="0.15" filter="url(#neonGlow)"/>

  <!-- Outer Glowing Squircle Border -->
  <rect x="22" y="22" width="468" height="468" rx="106" stroke="url(#rimGrad)" stroke-width="10" opacity="0.95"/>
  <rect x="30" y="30" width="452" height="452" rx="98" stroke="#FFFFFF" stroke-width="1.5" opacity="0.14"/>

  <!-- Handheld Console Body (Switch / AYN Thor) -->
  <g filter="url(#softShadow)">
    <!-- Left Cyan Controller -->
    <path d="M112 126 H148 V354 H112 C79 354 54 328 54 296 V184 C54 152 79 126 112 126 Z" fill="url(#leftGrip)"/>
    <circle cx="102" cy="196" r="18" fill="#0F172A" stroke="#BAE6FD" stroke-width="3"/>
    <!-- D-Pad -->
    <rect x="94" y="248" width="16" height="48" rx="4" fill="#0F172A"/>
    <rect x="78" y="264" width="48" height="16" rx="4" fill="#0F172A"/>

    <!-- Right Red Controller -->
    <path d="M364 126 H400 C433 126 458 152 458 184 V296 C458 328 433 354 400 354 H364 V126 Z" fill="url(#rightGrip)"/>
    <!-- ABXY Buttons -->
    <circle cx="410" cy="176" r="8" fill="#0F172A"/>
    <circle cx="410" cy="212" r="8" fill="#0F172A"/>
    <circle cx="392" cy="194" r="8" fill="#0F172A"/>
    <circle cx="428" cy="194" r="8" fill="#0F172A"/>
    <!-- Right Stick -->
    <circle cx="410" cy="272" r="18" fill="#0F172A" stroke="#FECDD3" stroke-width="3"/>

    <!-- Center OLED Screen -->
    <rect x="142" y="126" width="228" height="228" rx="18" fill="#0B1120" stroke="#334155" stroke-width="5"/>
    <rect x="154" y="138" width="204" height="204" rx="12" fill="#060A12" stroke="#1E293B" stroke-width="2"/>
  </g>

  <!-- Glowing Download Arrow inside Screen -->
  <g filter="url(#neonGlow)">
    <path d="M236 160 H276 V228 H312 L256 288 L200 228 H236 V160 Z"
          fill="url(#dlGrad)" stroke="#ECFDF5" stroke-width="3" stroke-linejoin="round"/>
    <rect x="196" y="302" width="120" height="14" rx="7" fill="#38BDF8"/>
  </g>

  <!-- Bottom RECOMP M4 + THOR Badge -->
  <g filter="url(#softShadow)">
    <rect x="96" y="388" width="320" height="54" rx="27" fill="#0F172A" stroke="url(#rimGrad)" stroke-width="4"/>
    <text x="256" y="422" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-weight="900" font-size="24" letter-spacing="1.5">SWITCH · M4 · THOR</text>
  </g>
</svg>
